<script>
var SEQ=[["l", "1", "1차시 단원 열기", "lesson/1.html"], ["l", "2-3", "2~3차시 선사 시대", "lesson/2-3.html"], ["l", "4", "4차시 청동기 시대", "lesson/4.html"], ["l", "5", "5차시 고조선", "lesson/5.html"], ["r", "review1", "1~5차시 복습", "review/1.html"], ["l", "6", "6차시 철기와 여러 나라", "lesson/6.html"], ["l", "7-8", "7~8차시 고대 국가의 발전", "lesson/7-8.html"], ["l", "9", "9차시 고대 국가의 교류", "lesson/9.html"], ["l", "10", "10차시 고대의 신분과 생활", "lesson/10.html"], ["r", "review2", "6~10차시 복습", "review/2.html"], ["l", "11-12", "11~12차시 고대의 문화", "lesson/11-12.html"], ["l", "13-14", "13~14차시 고려의 성립", "lesson/13-14.html"], ["l", "15", "15차시 고려의 대외 교류", "lesson/15.html"], ["r", "review3", "11~15차시 복습", "review/3.html"], ["l", "16", "16차시 고려 사람들의 생활", "lesson/16.html"], ["l", "17", "17차시 고려와 불교", "lesson/17.html"], ["l", "18-19", "18~19차시 고려의 문화", "lesson/18-19.html"], ["r", "review4", "16~19차시 복습", "review/4.html"], ["l", "20", "20차시 단원 마무리", "lesson/20.html"]];
var d=P.get(), done=d.done||{}, n=Object.keys(done).length, tot=SEQ.length;
document.getElementById('pct').textContent=n;
document.getElementById('prog').style.strokeDashoffset=327-327*(n/tot);
var nextItem=SEQ.find(function(x){return !done[x[1]]});
var last=d.last;
if(n===0){
  document.getElementById('heroTitle').textContent='수첩을 펼쳐 볼까요?';
  document.getElementById('heroSub').textContent='1차시부터 천천히 함께 가요.';
} else if(nextItem){
  document.getElementById('heroTitle').textContent=nextItem[2];
  document.getElementById('heroSub').textContent=(nextItem[0]==='r'?'복습 관문이 기다리고 있어요.':'이어서 해 볼까요?');
  document.getElementById('heroBtn').textContent='이어서 하기';
  document.getElementById('heroBtn').href=nextItem[3];
} else {
  document.getElementById('heroTitle').textContent='1단원, 전부 해결!';
  document.getElementById('heroSub').textContent='수첩이 도장으로 가득 찼어요.';
  document.getElementById('heroBtn').textContent='다시 둘러보기';
  document.getElementById('heroBtn').href='unit1.html';
}
document.getElementById('rst').addEventListener('click',function(e){
  e.preventDefault(); if(confirm('수첩에 찍은 도장을 모두 지울까요?')){P.reset();location.reload();}
});
